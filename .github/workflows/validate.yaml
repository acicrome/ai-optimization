---
name: Validate pattern and Helm charts

on:
  pull_request:
  push:
    branches: [main, validated-pattern]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Validate baseline, pattern wiring, and Helm charts
        run: make validate
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-helm-manifests
          path: dist/rendered
