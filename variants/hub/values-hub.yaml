---
# All applications point to source-backed Helm charts. Platform Operators and
# external prerequisites are deliberately not installed by this pattern.
clusterGroup:
  name: hub
  isHubCluster: true

  argoProjects:
    - ai-optimization

  applications:
    gpuaas:
      name: gpuaas
      namespace: team-inference
      argoProject: ai-optimization
      path: charts/all/gpuaas

    gpuaas-monitoring:
      name: gpuaas-monitoring
      namespace: redhat-ods-applications
      argoProject: ai-optimization
      path: charts/all/gpuaas-monitoring

    llm-d:
      name: llm-d
      namespace: agent
      argoProject: ai-optimization
      path: charts/all/llm-d

    observability:
      name: observability
      namespace: openshift-monitoring
      argoProject: ai-optimization
      path: charts/all/observability

    smart-model-router:
      name: smart-model-router
      namespace: smart-model-router
      argoProject: ai-optimization
      path: charts/all/smart-model-router
