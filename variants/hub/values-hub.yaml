---
# Applications, namespaces, and required Operators managed by the Validated Patterns framework.
clusterGroup:
  name: hub
  isHubCluster: true

  argoProjects:
    - ai-optimization

  namespaces:
    redhat-ods-operator: {}

    openshift-kueue-operator: {}

    team-inference:
      labels:
        kubernetes.io/metadata.name: team-inference
        opendatahub.io/dashboard: "true"
        kueue.openshift.io/managed: "true"
      annotations:
        argocd.argoproj.io/sync-wave: "-20"

    team-training:
      labels:
        kubernetes.io/metadata.name: team-training
        opendatahub.io/dashboard: "true"
        kueue.openshift.io/managed: "true"
      annotations:
        argocd.argoproj.io/sync-wave: "-20"

    smart-model-router:
      labels:
        app.kubernetes.io/name: smart-model-router
      annotations:
        argocd.argoproj.io/sync-wave: "-10"

  subscriptions:
    - name: rhods-operator
      namespace: redhat-ods-operator
      channel: stable-3.5
      source: redhat-operators

    - name: kueue-operator
      namespace: openshift-kueue-operator
      channel: stable-v1.3
      source: redhat-operators

  applications:
    rhoai-config:
      name: rhoai-config
      namespace: redhat-ods-applications
      argoProject: ai-optimization
      path: charts/all/rhoai-config

    gpuaas:
      name: gpuaas
      namespace: team-inference
      argoProject: ai-optimization
      path: charts/all/gpuaas

    gpuaas-monitoring:
      name: gpuaas-monitoring
      namespace: redhat-ods-applications
      argoProject: ai-optimization
      path: charts/all/gpuaas-monitoring

    llm-d:
      name: llm-d
      namespace: agent
      argoProject: ai-optimization
      path: charts/all/llm-d

    observability:
      name: observability
      namespace: openshift-monitoring
      argoProject: ai-optimization
      path: charts/all/observability

    smart-model-router:
      name: smart-model-router
      namespace: smart-model-router
      argoProject: ai-optimization
      path: charts/all/smart-model-router
