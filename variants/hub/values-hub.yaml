---
# This bill of materials references only deployable content already present in
# the verified source tree. Platform Operators and prerequisites are not
# installed by this pattern; they remain external prerequisites as documented
# by each source component.
clusterGroup:
  name: hub
  isHubCluster: true

  argoProjects:
    - ai-optimization

  applications:
    gpuaas:
      name: gpuaas
      namespace: team-inference
      argoProject: ai-optimization
      path: gpuaas
      kustomize: true

    gpuaas-monitoring:
      name: gpuaas-monitoring
      namespace: redhat-ods-applications
      argoProject: ai-optimization
      path: gpuaas/monitoring
      kustomize: true

    llm-d:
      name: llm-d
      namespace: agent
      argoProject: ai-optimization
      path: llm-d
      kustomize: true

    observability:
      name: observability
      namespace: openshift-monitoring
      argoProject: ai-optimization
      path: observability
      kustomize: true

    smart-model-router:
      name: smart-model-router
      namespace: smart-model-router
      argoProject: ai-optimization
      path: smart-model-router-validated-pattern/manifests
      kustomize: true
