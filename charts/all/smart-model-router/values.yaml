---
nameOverride: ""
fullnameOverride: smart-model-router
namespace:
  name: smart-model-router

replicaCount: 1
image:
  repository: image-registry.openshift-image-registry.svc:5000/openshift/python
  tag: 3.12-minimal-ubi9
  pullPolicy: IfNotPresent

service:
  port: 8080

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: ""

maas:
  url: https://maas.example.com
  tlsVerify: true
  apiKeySecretName: smart-router-maas-credentials
  apiKeySecretKey: MAAS_API_KEY

models:
  simple: publishers/agent/models/gpt-oss-20b
  complex: publishers/agent/models/qwen3-32b

classifier:
  url: http://llama-predictor.example.svc.cluster.local
  model: llama
  timeoutSeconds: 8
requestTimeoutSeconds: 300

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

resources: {}
podAnnotations: {}
podLabels: {}
