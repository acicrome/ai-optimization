---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smart-model-router.fullname" . }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "smart-model-router.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "smart-model-router.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
